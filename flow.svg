<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" fill="none" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">How I work: diagnose, design with users, ship, iterate</title>
<rect x=".5" y=".5" width="1199" height="199" rx="16" fill="#0D1117" stroke="#30363D"/>
<path d="M150 46H1050" stroke="#30363D" stroke-width="3"/>
<circle cx="150" cy="46" r="9" fill="#0D1117" stroke="#8EA2FF" stroke-width="3"/>
<text x="150" y="98" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">Diagnose first</text>
<text x="150" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">Audit the real bottleneck</text>
<text x="150" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">with data, not hunches</text>
<circle cx="450" cy="46" r="9" fill="#0D1117" stroke="#8EA2FF" stroke-width="3"/>
<text x="450" y="98" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">Design with users</text>
<text x="450" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">Talk to the people who feel</text>
<text x="450" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">the pain before writing code</text>
<circle cx="750" cy="46" r="9" fill="#0D1117" stroke="#8EA2FF" stroke-width="3"/>
<text x="750" y="98" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">Ship 0 → 1</text>
<text x="750" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">Get a working version</text>
<text x="750" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">in front of users fast</text>
<circle cx="1050" cy="46" r="9" fill="#8EA2FF" stroke="#8EA2FF" stroke-width="3"/>
<text x="1050" y="98" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">Iterate 1 → 100</text>
<text x="1050" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">Let feedback shape the roadmap</text>
<text x="1050" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">until the product sticks</text>
<circle r="13" fill="#8EA2FF" fill-opacity=".25"><animateMotion dur="7s" repeatCount="indefinite" path="M150 46H1050"/></circle>
<circle r="5" fill="#E6EDF3"><animateMotion dur="7s" repeatCount="indefinite" path="M150 46H1050"/></circle></svg>