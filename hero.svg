<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Rohit Sharma, full-stack engineer</title>
  <desc id="d">Hero banner: a product dashboard mockup beside key proof points.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#8EA2FF" stop-opacity=".28"/><stop offset="1" stop-color="#8EA2FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8EA2FF" stop-opacity=".3"/><stop offset="1" stop-color="#8EA2FF" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="clip"><rect width="1200" height="460" rx="20"/></clipPath>
    <clipPath id="win"><rect x="690" y="64" width="450" height="332" rx="16"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="460" fill="#0D1117"/>
    <rect width="1200" height="460" fill="url(#dots)"/>
    <circle cx="1000" cy="150" r="320" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 40;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- availability -->
    <rect x="64" y="52" width="340" height="32" rx="16" fill="#161B22" stroke="#30363D"/>
    <circle cx="82" cy="68" r="4.5" fill="#3FB950">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#C9D1D9">Open to full-stack roles, remote or relocation</text>

    <!-- identity -->
    <text x="64" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#E6EDF3">Rohit Sharma</text>
    <text x="64" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#E6EDF3">Full-stack engineer with a product brain.</text>
    <text x="64" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8B949E">I find what slows real users down, then design, build and ship the fix.</text>

    <!-- proof -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#E6EDF3">
      <circle cx="74" cy="296" r="10" fill="#8EA2FF" fill-opacity=".18"/><path d="M69 296.5l3.5 3.5 6.5-7.5" stroke="#8EA2FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="302">LFX Mentee, RISC-V International (Linux Foundation)</text>
      <circle cx="74" cy="330" r="10" fill="#8EA2FF" fill-opacity=".18"/><path d="M69 330.5l3.5 3.5 6.5-7.5" stroke="#8EA2FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="336">Built a contributor platform used daily by 100+ people, solo</text>
      <circle cx="74" cy="364" r="10" fill="#8EA2FF" fill-opacity=".18"/><path d="M69 364.5l3.5 3.5 6.5-7.5" stroke="#8EA2FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="370">16+ PRs merged or approved at OWASP</text>
    </g>
    <text x="64" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8B949E">React, Next.js, TypeScript, Node.js, PostgreSQL</text>

    <!-- product mockup -->
    <g filter="url(#sh)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <rect x="690" y="64" width="450" height="332" rx="16" fill="#161B22"/>
        <g clip-path="url(#win)">
          <rect x="690" y="64" width="450" height="40" fill="#1C2230"/>
          <circle cx="712" cy="84" r="5" fill="#FF5F57"/><circle cx="730" cy="84" r="5" fill="#FEBC2E"/><circle cx="748" cy="84" r="5" fill="#28C840"/>
          <rect x="780" y="72" width="250" height="24" rx="12" fill="#0D1117"/>
          <text x="796" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8B949E">yourproduct.app/insights</text>
          <rect x="690" y="104" width="60" height="292" fill="#12161E"/>
          <rect x="706" y="124" width="28" height="28" rx="8" fill="#8EA2FF"/>
          <rect x="706" y="168" width="28" height="28" rx="8" fill="#30363D"/>
          <rect x="706" y="212" width="28" height="28" rx="8" fill="#30363D"/>
          <rect x="706" y="256" width="28" height="28" rx="8" fill="#30363D"/>
          <rect x="706" y="300" width="28" height="28" rx="8" fill="#30363D"/>

          <text x="766" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#E6EDF3">Contributor impact</text>
          <text x="1124" y="130" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">Last 30 days</text>

          <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
            <rect x="766" y="144" width="110" height="64" rx="10" fill="#0D1117" stroke="#30363D"/>
            <text x="778" y="165" font-size="10" fill="#8B949E">PRs merged</text><text x="778" y="193" font-size="20" font-weight="700" fill="#E6EDF3">128</text>
            <rect x="890" y="144" width="110" height="64" rx="10" fill="#0D1117" stroke="#30363D"/>
            <text x="902" y="165" font-size="10" fill="#8B949E">Cycle time</text><text x="902" y="193" font-size="20" font-weight="700" fill="#3FB950">−38%</text>
            <rect x="1014" y="144" width="110" height="64" rx="10" fill="#0D1117" stroke="#30363D"/>
            <text x="1026" y="165" font-size="10" fill="#8B949E">Retention</text><text x="1026" y="193" font-size="20" font-weight="700" fill="#E6EDF3">92%</text>
          </g>

          <rect x="766" y="222" width="358" height="148" rx="10" fill="#0D1117" stroke="#30363D"/>
          <text x="782" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#C9D1D9">Weekly activity</text>
          <text x="1108" y="246" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#3FB950">+24%</text>
          <path d="M782 290H1108M782 318H1108M782 346H1108" stroke="#30363D" stroke-width="1"/>
          <path d="M782 346C816 340 826 312 862 318S920 288 956 296S1010 322 1046 292S1090 268 1108 262L1108 358L782 358Z" fill="url(#area)">
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.28;.45;1" dur="8s" repeatCount="indefinite"/>
          </path>
          <path d="M782 346C816 340 826 312 862 318S920 288 956 296S1010 322 1046 292S1090 268 1108 262" stroke="#8EA2FF" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0">
            <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.3;1" dur="8s" repeatCount="indefinite"/>
          </path>
          <circle cx="1108" cy="262" r="5" fill="#E6EDF3">
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.28;.32;1" dur="8s" repeatCount="indefinite"/>
          </circle>
          <circle cx="1108" cy="262" r="5" fill="#8EA2FF" fill-opacity=".5">
            <animate attributeName="r" values="5;16" dur="2s" begin="2.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".6;0" dur="2s" begin="2.4s" repeatCount="indefinite"/>
          </circle>
        </g>
        <rect x="690.5" y="64.5" width="449" height="331" rx="16" stroke="#30363D"/>
      </g>
    </g>

    <!-- toast: the single orchestrated moment -->
    <g transform="translate(640 366)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="-18 0;-18 0;0 0;0 0;0 0" keyTimes="0;.12;.2;.9;1" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.12;.2;.9;1" dur="8s" repeatCount="indefinite"/>
          <rect width="262" height="56" rx="14" fill="#1C2230" stroke="#3FB950" stroke-opacity=".6"/>
          <circle cx="28" cy="28" r="12" fill="#3FB950" fill-opacity=".2"/>
          <path d="M22 28.5l4 4 8-9" stroke="#3FB950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="52" y="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#E6EDF3">Shipped from user feedback</text>
          <text x="52" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">side panel → full-screen workspace</text>
        </g>
      </g>
    </g>

    <!-- PR badge -->
    <g transform="translate(978 28)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" keyTimes="0;.5;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <rect width="182" height="36" rx="18" fill="#1C2230" stroke="#30363D"/>
        <circle cx="20" cy="18" r="10" fill="#8957E5" fill-opacity=".3"/>
        <path d="M15 18.5l3.5 3.5 6-7" stroke="#A371F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E6EDF3">Pull request merged</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="459" rx="20" stroke="#30363D"/>
</svg>
